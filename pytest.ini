[pytest]
testpaths = tests
markers =
    slow: exercises the full walk-forward backtest, which refits GARCH 102 times per
        run and takes on the order of a minute. Run `pytest -m "not slow"` for a fast
        inner loop during development. Plain `pytest` still runs everything under this
        marker: the look-ahead audit lives behind it and is on the governing plan's
        never-cut list, so it must never be what a default test run skips.
    bayes_audit: the look-ahead audit run with NUTS actually sampling, about 40 minutes.
        Skipped unless `--bayes-audit` is passed -- a flag rather than a marker
        deselection, because a command line carrying its own `-m` replaces an addopts
        one rather than adding to it, so `pytest -m "not slow"` would have selected it.
        See conftest.py. This is the one skip the never-cut rule tolerates, because it
        removes no coverage from a default run: the Bayesian track's look-ahead surfaces
        are audited on every `pytest` against a recording stub (decision D26), which
        checks the sampler's inputs more directly than the sampler itself can. This test
        adds the end-to-end confirmation that a seeded NUTS run is a function of its
        estimation window alone. Run it deliberately before the write-up:
        `pytest --bayes-audit -m bayes_audit`.
